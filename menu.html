    <main class="container my-5">
      <section class="gallery-section">
        <h2>Our Toasties</h2>
        <div class="accordion image-accordion" id="toastieAccordion">
          <div class="accordion-item">
            <h3 class="accordion-header" id="headingThreeCheese">
              <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseThreeCheese" aria-expanded="true" aria-controls="collapseThreeCheese">
                3 Cheese
              </button>
            </h3>
            <div id="collapseThreeCheese" class="accordion-collapse collapse show" aria-labelledby="headingThreeCheese" data-bs-parent="#toastieAccordion">
              <div class="accordion-body">
                <img src="images/3 Cheese - Thats Mature.jpg" alt="3 Cheese toastie">
              </div>
            </div>
          </div>

          <div class="accordion-item">
            <h3 class="accordion-header" id="headingSpicyOne">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseSpicyOne" aria-expanded="false" aria-controls="collapseSpicyOne">
                The Spicy One
              </button>
            </h3>
            <div id="collapseSpicyOne" class="accordion-collapse collapse" aria-labelledby="headingSpicyOne" data-bs-parent="#toastieAccordion">
              <div class="accordion-body">
                <img src="images/The Spicy One - Thats Mature.jpg" alt="The Spicy One toastie">
              </div>
            </div>
          </div>

          <div class="accordion-item">
            <h3 class="accordion-header" id="headingFamily">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseFamily" aria-expanded="false" aria-controls="collapseFamily">
                Event Favourite
              </button>
            </h3>
            <div id="collapseFamily" class="accordion-collapse collapse" aria-labelledby="headingFamily" data-bs-parent="#toastieAccordion">
              <div class="accordion-body">
                <img src="images/IMG_20240709_165845_024.jpg" alt="That's Mature event toastie">
              </div>
            </div>
          </div>

          <div class="accordion-item">
            <h3 class="accordion-header" id="headingHamCheese">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseHamCheese" aria-expanded="false" aria-controls="collapseHamCheese">
                Classic Ham &amp; Cheese
              </button>
            </h3>
            <div id="collapseHamCheese" class="accordion-collapse collapse" aria-labelledby="headingHamCheese" data-bs-parent="#toastieAccordion">
              <div class="accordion-body">
                <img src="images/Classic Ham & Cheese - Thats mature.jpg" alt="Classic Ham and Cheese toastie">
              </div>
            </div>
          </div>
        </div>
